[general]
import = ["~/.config/alacritty/catppuccin-frappe.toml"]

[window]
blur = true
dynamic_padding = true
dynamic_title = true
opacity = 0.85
padding = { x = 12, y = 12 }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Tab"
mods = "Control"
action = "SelectNextTab"

[[keyboard.bindings]]
key = "Tab"
mods = "Control|Shift"
action = "SelectPreviousTab"
