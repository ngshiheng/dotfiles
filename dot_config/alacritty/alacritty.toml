import = ["~/.config/alacritty/catppuccin-frappe.toml"]

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.85
blur = true

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500


[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"
